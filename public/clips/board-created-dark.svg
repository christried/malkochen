<!-- A new Board's celebration (handoff REMOTION.md "board-created", as
     remotion/src/clips/board-created.tsx drew it, at a third of its 780
     canvas): the Board's pebble pops in with a twist at f3 (−30° to +8° at
     f9) and rests from f13, as ten pebbles of confetti in the Column accents
     burst out from its edge, evenly round from the top, spinning alternately
     each way, gone by f18. 36 frames (1.2s), played once. No background: it
     sits on the celebration's wash. The drawing as it stands is the last
     frame, the still: the pebble resting alone. The Board's emoji on it is
     Vue's (BoardCreatedCelebration). Played by SvgLoop; keyframes in
     app/assets/css/loops.css. -->
