<!-- The invite landing, after its intro (handoff REMOTION.md "invite-loop", as
     remotion/src/clips/invite-loop.tsx drew it, at a third of its 780×750
     canvas): six veggies go round the Board's pebble once in the 14s loop,
     staying upright, while the pebble bobs ±8 (of 750) every 2.8s and
     Topfbert happy bobs, sways his hat, steams and blinks at the bottom
     left. Frame 0 is the still. The Board's emoji and the Member avatars are
     Vue (InviteClip), the emoji taking the pebble's bob. No background: the
     butter blob is InviteClip's (ClipBlob), in the page's colour. Played by InviteClip
     (SvgLoop); keyframes in app/assets/css/loops.css. -->
