<!-- A search with no results (handoff REMOTION.md "search-empty", as
     remotion/src/clips/search-empty.tsx drew it): the magnifier swings from
     −10° on the left to +10° on the right and back, and while it looks away
     the pea peeks out from behind the plate (f54–80 of 108) and ducks. No
     background: it sits on the page. Played by SearchEmpty (SvgLoop);
     keyframes in app/assets/css/loops.css. Frame 0 is the still. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 102" width="660" height="510" data-clip="search-empty" data-theme="dark"><g data-layer="pea" data-loop="se-peek 3.6s linear infinite"><svg x="29" y="65.75" width="30" height="30" viewBox="0 0 48 48" overflow="visible"><g data-part="body"><circle cx="24" cy="26" r="16" fill="#8DB596" stroke="#1F1E1C" stroke-width="2.5"></circle></g><g data-part="eyes"><circle cx="19" cy="24" r="2.2" fill="#1F1E1C"></circle><circle cx="29" cy="24" r="2.2" fill="#1F1E1C"></circle></g><g data-part="mouth"><path d="M20.5 30Q24 33 27.5 30" fill="none" stroke="#1F1E1C" stroke-width="2" stroke-linecap="round"></path></g></svg></g><g data-layer="plate"><svg x="6" y="46" width="120" height="60" viewBox="0 0 120 60" overflow="visible"><ellipse cx="60" cy="34" rx="54" ry="18" fill="#1E1C1A" stroke="#F3EFE8" stroke-width="2.5"></ellipse><ellipse cx="60" cy="32" rx="36" ry="10" fill="none" stroke="#F3EFE8" stroke-opacity=".18" stroke-width="2"></ellipse></svg></g><g data-layer="magnifier" data-loop="se-sweep 3.6s linear infinite" data-pivot="54 38"><g transform="rotate(-10 54 38)"><svg x="22" y="6" width="64" height="64" viewBox="0 0 64 64" overflow="visible"><circle cx="27" cy="27" r="17" fill="#1E1C1A" fill-opacity=".6" stroke="#F3EFE8" stroke-width="4"></circle><path d="M40 40L56 56" stroke="#F3EFE8" stroke-width="6" stroke-linecap="round"></path></svg></g></g></svg>
