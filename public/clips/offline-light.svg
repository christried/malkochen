<!-- Offline (handoff REMOTION.md "offline", as remotion/src/clips/offline.tsx
     drew it, at a third of its 660×600 canvas): Topfbert asleep, 60%
     desaturated, bobbing and swaying his hat, two z's drifting up from him
     half a loop apart, beside a Wi-Fi sign whose outer arc fades to 12% at
     f20–29 and the inner one at f31–40, both back by f72: a 72-frame (2.4s)
     loop. Every layer is f40 into it, the brief's still (both arcs faded),
     which is how the drawing stands. The z's are drawn, not text: a still is
     this file as an image, which has no fonts. No background: the sky blob is
     OfflineScreen's (ClipBlob), in the page's colour. Played by OfflineScreen (SvgLoop) and
     drawn into public/offline.html; keyframes in app/assets/css/loops.css. -->
