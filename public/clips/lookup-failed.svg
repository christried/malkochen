<!-- The lookup failed (handoff REMOTION.md "lookup-failed", as
     remotion/src/clips/lookup-failed.tsx drew it, on its 276×256 canvas):
     Topfbert oops wobbles between −6° and −2°, sways his hat, and breaks into
     a sweat drop that swells at f14–22 and slides off from f58, in a
     72-frame (2.4s) loop. Every layer is a second (f30) into it, the brief's
     still, which is how the drawing stands. No background: it sits on the
     failed card's surface-muted. Drawn the same in both themes, as Topfbert
     keeps his ink. Played by AddDishSheet (SvgLoop); keyframes in
     app/assets/css/loops.css. -->
