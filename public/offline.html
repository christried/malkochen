<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131211">
  <title>malkochen</title>
  <!--
    The page the service worker (sw.js) serves when a page of malkochen can't
    be loaded. It tells the two reasons apart, so people know whether it's
    them or us:
    - the device has no connection: "Du bist offline" (the Offline screen);
    - it has one, but malkochen doesn't answer: "nicht erreichbar", our side.
    It can't use the app, so it repeats what the app shows on its own: the
    strings from app/strings/de.ts (offline; "nicht erreichbar" lives only
    here), the offline clip as app/components/MotionClip.vue plays it, the
    picture from app/error.vue's still, the colours from tokens.css, and the
    type as app/components/SystemScreen.vue sets it (tokens.json → type:
    title-l, from 768px display-m; body; button). Keep them in step, and bump
    VERSION in sw.js.
    Its fonts are fixed copies in public/fonts/ (the app's own, from
    @nuxt/fonts, have hashed names the service worker can't know): Figtree
    and Petrona, upright, latin and latin-ext, as Google serves them.
  -->
  <script>
    // The appearance chosen in settings (useTheme's cookie); "system" sets none.
    var theme = (document.cookie.match(/(?:^|; )malkochen-theme=(light|dark)(?:;|$)/) || [])[1]
    if (theme) document.documentElement.setAttribute('data-theme', theme)
  </script>
  <style>
    @font-face { font-family: Figtree; src: url(/fonts/figtree-latin.woff2) format('woff2'); font-weight: 300 900; font-style: normal; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: Figtree; src: url(/fonts/figtree-latin-ext.woff2) format('woff2'); font-weight: 300 900; font-style: normal; font-display: swap; unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: Petrona; src: url(/fonts/petrona-latin.woff2) format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: Petrona; src: url(/fonts/petrona-latin-ext.woff2) format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    :root { --bg: #F7F6F2; --text: #1F1E1C; --text-muted: #6F6B65; --inverse: #1F1E1C; --on-inverse: #FFFFFF; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #131211; --text: #F3EFE8; --text-muted: #A8A298; --inverse: #F3EFE8; --on-inverse: #131211; color-scheme: dark; }
    }
    [data-theme="dark"] { --bg: #131211; --text: #F3EFE8; --text-muted: #A8A298; --inverse: #F3EFE8; --on-inverse: #131211; color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; background: var(--bg); color: var(--text); text-align: center; font-family: Figtree, system-ui, sans-serif; }
    .screen { display: flex; flex-direction: column; align-items: center; }
    .art { position: relative; width: min(72vw, 300px); aspect-ratio: 11 / 10; }
    .blob { position: absolute; inset: 6%; border-radius: 48% 52% 46% 54% / 55% 50% 50% 45%; }
    .carrot { background: color-mix(in oklch, #F08A5D 24%, var(--bg)); }
    .still, .clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .clip { opacity: 0; }
    .clip.shown { opacity: 1; }
    .only-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .only-light { display: none; }
      :root:not([data-theme="light"]) .only-dark { display: block; }
    }
    [data-theme="dark"] .only-light { display: none; }
    [data-theme="dark"] .only-dark { display: block; }
    .spill { position: absolute; bottom: 10%; left: 50%; height: 9%; width: 54%; transform: translateX(-50%); border-radius: 50%; background: color-mix(in oklch, #F08A5D 40%, var(--bg)); }
    .oops { position: absolute; bottom: 12%; left: 50%; width: 56%; transform: translateX(-50%) rotate(-6deg); }
    /* Topfbert idles, as TopfbertIdle plays him in the app (public/clips/
       topfbert-idle-oops.svg; keyframes from app/assets/css/loops.css):
       breathes and blinks, his drop falls. Reduced motion: still. */
    .oops g { transform-box: view-box; }
    .tb-eyes_closed { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .tb-whole { transform-origin: 70px 123px; animation: r11-breathe 3s ease-in-out infinite both; }
      .tb-eyes { animation: r11-ieo 6s linear infinite both; }
      .tb-eyes_closed { animation: r11-iec 6s linear infinite both; }
      .tb-drop { transform-box: fill-box; transform-origin: center; animation: tb-drop 2.4s ease-in infinite both; }
    }
    @keyframes r11-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.025)}}
    @keyframes r11-ieo{0%,33%{opacity:1}33.5%,35.5%{opacity:0}36%,83%{opacity:1}83.5%,85.5%{opacity:0}86%,88%{opacity:1}88.5%,90.5%{opacity:0}91%,100%{opacity:1}}
    @keyframes r11-iec{0%,33%{opacity:0}33.5%,35.5%{opacity:1}36%,83%{opacity:0}83.5%,85.5%{opacity:1}86%,88%{opacity:0}88.5%,90.5%{opacity:1}91%,100%{opacity:0}}
    @keyframes tb-drop { 0%, 20% { transform: scale(0); opacity: 1 } 30%, 80% { transform: none; opacity: 1 } 100% { transform: translateY(14px); opacity: 0 } }
    h1 { margin: 24px 0 0; font: 500 28px / 1.1 Petrona, Georgia, serif; letter-spacing: -0.015em; }
    @media (min-width: 768px) {
      h1 { font-size: 32px; line-height: 1.08; letter-spacing: -0.02em; }
    }
    p { margin: 8px 0 0; max-width: 360px; color: var(--text-muted); font-size: 15.5px; line-height: 1.45; font-weight: 500; }
    button { margin-top: 32px; border: 0; border-radius: 999px; padding: 14px 20px; background: var(--inverse); color: var(--on-inverse); font: 600 15px / 1 Figtree, system-ui, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 2px solid rgba(247,185,74,.75); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="offline" class="screen" hidden>
    <div class="art">
      <img class="still only-light" src="/clips/offline-light.png" alt="">
      <img class="still only-dark" src="/clips/offline-dark.png" alt="">
      <video class="clip" muted playsinline loop preload="none" disablepictureinpicture aria-hidden="true" hidden></video>
    </div>
    <h1>Du bist offline.</h1>
    <p>Sobald du wieder Netz hast, geht’s hier weiter.</p>
  </div>
  <div id="unreachable" class="screen" hidden>
    <div class="art">
      <div class="blob carrot"></div>
      <div class="spill"></div>
      <svg class="oops" viewBox="0 -20 140 150" aria-hidden="true" data-topfbert-idle>
      <g class="tb-whole">
        <g class="tb-handles"><rect x="9.25" y="59.25" width="19.5" height="10.5" rx="5.5" fill="#C7E0CD" stroke="#1F1E1C" stroke-width="2.5"></rect><rect x="111.25" y="59.25" width="19.5" height="10.5" rx="5.5" fill="#C7E0CD" stroke="#1F1E1C" stroke-width="2.5"></rect></g>
        <g class="tb-body"><path d="M21.25 48V88A38.75 34.75 0 0 0 60 122.75H80A38.75 34.75 0 0 0 118.75 88V48Z" fill="#A5C7AE" stroke="#1F1E1C" stroke-width="2.5"></path></g>
        <g class="tb-eyes"><ellipse cx="50" cy="73.5" rx="4" ry="4.5" fill="#1F1E1C"></ellipse><rect x="83" y="72" width="13" height="3" rx="1.5" fill="#1F1E1C" transform="rotate(-12 89.5 73.5)"></rect></g>
        <g class="tb-eyes_closed"><path d="M45.5 72.5Q50.5 77.5 55.5 72.5M84.5 72.5Q89.5 77.5 94.5 72.5" fill="none" stroke="#1F1E1C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g>
        <g class="tb-cheeks"><ellipse cx="41.5" cy="86" rx="7.5" ry="4" fill="#F4A9A0" opacity=".85"></ellipse><ellipse cx="98.5" cy="86" rx="7.5" ry="4" fill="#F4A9A0" opacity=".85"></ellipse></g>
        <g class="tb-mouth"><rect x="60" y="87" width="18" height="3" rx="1.5" fill="#1F1E1C" transform="rotate(8 69 88.5)"></rect></g>
        <g class="tb-rim"><rect x="13.25" y="41.25" width="113.5" height="12.5" rx="6.5" fill="#C7E0CD" stroke="#1F1E1C" stroke-width="2.5"></rect></g>
        <g class="tb-hat"><g transform="rotate(-14 36 46)"><g><circle cx="22" cy="6" r="10.75" fill="#fff" stroke="#1F1E1C" stroke-width="2.5"></circle><circle cx="39" cy="1" r="11.75" fill="#fff" stroke="#1F1E1C" stroke-width="2.5"></circle><circle cx="50" cy="8" r="8.75" fill="#fff" stroke="#1F1E1C" stroke-width="2.5"></circle><rect x="16" y="8" width="40" height="22" fill="#fff"></rect><rect x="16.25" y="23.25" width="39.5" height="13.5" rx="3" fill="#fff" stroke="#1F1E1C" stroke-width="2.5"></rect></g></g></g>
        <g class="tb-drop"><path d="M118 53C122 58 123 61 123 63A5 5 0 0 1 113 63C113 61 114 58 118 53Z" fill="#A8D4F0" stroke="#1F1E1C" stroke-width="2"></path></g>
      </g>
      </svg>
    </div>
    <h1>malkochen ist gerade nicht erreichbar.</h1>
    <p>Dein Internet geht, aber malkochen antwortet gerade nicht. Das liegt an uns, nicht an dir. Versuch es gleich noch mal.</p>
  </div>
  <button type="button" onclick="location.reload()">Nochmal versuchen</button>
  <script>
    var screens = { offline: document.getElementById('offline'), unreachable: document.getElementById('unreachable') }
    function show() {
      var shown = navigator.onLine ? 'unreachable' : 'offline'
      screens.offline.hidden = shown !== 'offline'
      screens.unreachable.hidden = shown !== 'unreachable'
      document.title = (shown === 'offline' ? 'Offline' : 'Nicht erreichbar') + ' · malkochen'
    }
    show()
    window.addEventListener('offline', show)

    // The offline clip over its still, in the theme shown; never with reduced
    // motion. It stays hidden until it has a frame up.
    function playClip() {
      if (screens.offline.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) return
      var dark = document.documentElement.getAttribute('data-theme') === 'dark'
        || (!document.documentElement.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches)
      var video = document.querySelector('.clip')
      var name = '/clips/offline-' + (dark ? 'dark' : 'light')
      video.innerHTML = '<source src="' + name + '.webm" type="video/webm"><source src="' + name + '.mp4" type="video/mp4">'
      video.hidden = false
      video.addEventListener('playing', function () { video.classList.add('shown') }, { once: true })
      video.play().catch(function () {})
    }
    playClip()
    // Back online: carry on where the visit was going, once malkochen
    // answers. A device often says it is online before the connection gets
    // through, and reloading then would only land here again, with no
    // second "online" to try once more. So it asks first (HEAD, through the
    // service worker like the reload), again and again, a little longer
    // apart each time, until the connection drops again.
    var waiting
    function carryOnOnceReachable(delay) {
      clearTimeout(waiting)
      if (!navigator.onLine) return
      fetch(location.href, { method: 'HEAD', cache: 'no-store', redirect: 'manual' })
        .then(function (response) {
          // Vercel's own error pages: malkochen isn't up yet (as sw.js).
          if (response.status >= 500 && response.headers.has('x-vercel-error')) throw new Error('platform error')
          location.reload()
        })
        .catch(function () {
          waiting = setTimeout(function () { carryOnOnceReachable(Math.min(delay * 2, 10000)) }, delay)
        })
    }
    window.addEventListener('online', function () { carryOnOnceReachable(500) })
  </script>
</body>
</html>
