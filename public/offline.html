<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131211">
  <title>malkochen</title>
  <!--
    The page the service worker (sw.js) serves when a page of malkochen can't
    be loaded. It tells the two reasons apart, so people know whether it's
    them or us:
    - the device has no connection: "Du bist offline" (the Offline screen);
    - it has one, but malkochen doesn't answer: "nicht erreichbar", our side.
    It can't use the app, so it repeats what the app shows on its own: the
    strings from app/strings/de.ts (offline; "nicht erreichbar" lives only
    here), the pictures from app/components/OfflineIllustration.vue and
    app/error.vue, and the colours from tokens.css. Keep them in step, and
    bump VERSION in sw.js.
  -->
  <script>
    // The appearance chosen in settings (useTheme's cookie); "system" sets none.
    var theme = (document.cookie.match(/(?:^|; )malkochen-theme=(light|dark)(?:;|$)/) || [])[1]
    if (theme) document.documentElement.setAttribute('data-theme', theme)
  </script>
  <style>
    :root { --bg: #F7F6F2; --text: #1F1E1C; --text-muted: #6F6B65; --inverse: #1F1E1C; --on-inverse: #FFFFFF; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #131211; --text: #F3EFE8; --text-muted: #A8A298; --inverse: #F3EFE8; --on-inverse: #131211; color-scheme: dark; }
    }
    [data-theme="dark"] { --bg: #131211; --text: #F3EFE8; --text-muted: #A8A298; --inverse: #F3EFE8; --on-inverse: #131211; color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; background: var(--bg); color: var(--text); text-align: center; font-family: "Hanken Grotesk", system-ui, sans-serif; }
    .screen { display: flex; flex-direction: column; align-items: center; }
    .art { position: relative; width: min(72vw, 300px); aspect-ratio: 11 / 10; }
    .blob { position: absolute; inset: 6%; border-radius: 48% 52% 46% 54% / 55% 50% 50% 45%; }
    .sky { background: color-mix(in oklch, #A8BEE3 28%, var(--bg)); }
    .carrot { background: color-mix(in oklch, #F08A5D 24%, var(--bg)); }
    .sleeping { position: absolute; bottom: 4%; left: 12%; width: 56%; filter: saturate(.4); }
    .wifi { position: absolute; right: 10%; top: 10%; width: 26%; color: var(--text); }
    .spill { position: absolute; bottom: 10%; left: 50%; height: 9%; width: 54%; transform: translateX(-50%); border-radius: 50%; background: color-mix(in oklch, #F08A5D 40%, var(--bg)); }
    .oops { position: absolute; bottom: 12%; left: 50%; width: 56%; transform: translateX(-50%) rotate(-6deg); }
    h1 { margin: 24px 0 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.15; }
    p { margin: 8px 0 0; max-width: 360px; color: var(--text-muted); font-size: 16px; line-height: 1.5; }
    button { margin-top: 32px; border: 0; border-radius: 999px; padding: 14px 20px; background: var(--inverse); color: var(--on-inverse); font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; }
    button:focus-visible { outline: 2px solid rgba(247,185,74,.75); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="offline" class="screen" hidden>
    <div class="art">
      <div class="blob sky"></div>
      <img class="sleeping" src="/illustrations/topfbert-sleep.svg" alt="">
      <svg class="wifi" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M8 26A34 34 0 0 1 56 26" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".12"/>
        <path d="M17 36A21 21 0 0 1 47 36" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".12"/>
        <path d="M26 46A8 8 0 0 1 38 46" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        <circle cx="32" cy="54" r="3.5" fill="currentColor"/>
      </svg>
    </div>
    <h1>Du bist offline.</h1>
    <p>Sobald du wieder Netz hast, geht’s hier weiter.</p>
  </div>
  <div id="unreachable" class="screen" hidden>
    <div class="art">
      <div class="blob carrot"></div>
      <div class="spill"></div>
      <img class="oops" src="/illustrations/topfbert-oops.svg" alt="">
    </div>
    <h1>malkochen ist gerade nicht erreichbar.</h1>
    <p>Dein Internet geht, aber malkochen antwortet gerade nicht. Das liegt an uns, nicht an dir. Versuch es gleich noch mal.</p>
  </div>
  <button type="button" onclick="location.reload()">Nochmal versuchen</button>
  <script>
    var screens = { offline: document.getElementById('offline'), unreachable: document.getElementById('unreachable') }
    function show() {
      var shown = navigator.onLine ? 'unreachable' : 'offline'
      screens.offline.hidden = shown !== 'offline'
      screens.unreachable.hidden = shown !== 'unreachable'
      document.title = (shown === 'offline' ? 'Offline' : 'Nicht erreichbar') + ' · malkochen'
    }
    show()
    window.addEventListener('offline', show)
    // Back online: carry on where the visit was going.
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
