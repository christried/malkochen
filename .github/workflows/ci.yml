name: CI
# Runs on PRs only, on the self-hosted runner `malkochen-wsl` (WSL Ubuntu on
# the maintainer's PC, Docker for the Postgres service): Actions minutes are
# billed on this private repo, self-hosted ones aren't. With the PC off, runs
# wait in the queue. The merge to main starts no second run.
# Docs and Markdown alone can't break the app, so they start no run. main has
# no required checks, so a skipped run blocks nothing.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# A new push to a PR makes the run for its previous push pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Throwaway Postgres for the API and browser tests. Its credentials only exist
# inside the job, so TEST_DATABASE_ADMIN_URL needs no secret.
env:
  TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  # One job on purpose: every job pays checkout, install and Postgres again and
  # is billed in whole minutes, so shards cost more minutes than they save in
  # wall-clock. A failed lint, typecheck or unit test skips the browser tests.
  check:
    runs-on: malkochen-wsl
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The runner keeps browsers on disk, so this is a no-op until Playwright
      # updates. Their system libraries are installed once by hand (needs root):
      # npx playwright@<version> install-deps chromium
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
