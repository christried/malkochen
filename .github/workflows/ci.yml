name: CI
# Runs on PRs only, on GitHub-hosted runners (free: the repo is public). The PR
# run already tested the branch merged with main, so the merge starts no second
# run. Docs and Markdown alone can't break the app, so they start no run. main
# has no required checks, so a skipped run blocks nothing.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# A new push to a PR makes the run for its previous push pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Throwaway Postgres for the API and browser tests. Its credentials only exist
# inside each job, so TEST_DATABASE_ADMIN_URL needs no secret.
env:
  TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The browser tests are most of the run, so they split across shards that
  # run next to `check`, by measured time (tests/e2e/shards.ts). Spec files
  # run one after another within a shard, each shard on its own database.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: e2e (${{ matrix.shard }}/8)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The browser download is cached per Playwright version; its system
      # libraries aren't cacheable, so a hit still installs those.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/8
      # The traces of failed tries (playwright.config.ts), also of a flake
      # the retry rescued, so the job can be green and still upload some.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          # Hidden files stay out, so the .last-run.json Playwright writes on
          # every run uploads nothing by itself.
          path: test-results/
          if-no-files-found: ignore
          # A re-run job uploads under the same name.
          overwrite: true
          retention-days: 14
