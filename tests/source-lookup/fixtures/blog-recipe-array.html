io is a New York Times bestselling cookbook author, recipe developer, and the creator of Love & Lemons. She shares trusted and tested vegetarian recipes for cooks of all levels. Jeanine's work has been featured in Bon Appetit, The Washington Post, Good Morning America, People, and more.","sameAs":["https://www.loveandlemons.com/jeanine-donofrio/","https://www.instagram.com/loveandlemons/","https://www.facebook.com/lovelemonsfood","https://www.pinterest.com/loveandlemons/"],"image":["https://cdn.loveandlemons.com/wp-content/themes/loveandlemons6/images/jeanine720x720.jpg","https://cdn.loveandlemons.com/wp-content/themes/loveandlemons6/images/jeanine720x540.jpg","https://cdn.loveandlemons.com/wp-content/themes/loveandlemons6/images/jeanine720x404.jpg"],"url":"https://www.loveandlemons.com/jeanine-donofrio/"},{"@type":"Person","@id":"https://www.loveandlemons.com/phoebe-moore/#person","name":"Phoebe Moore","description":"Phoebe Moore is the Love & Lemons managing editor and recipe developer. Since joining Love & Lemons in 2018, she has collaborated on three Love & Lemons cookbooks, including Simple Feel Good Food, a New York Times bestseller. She has developed, tested, and edited hundreds of trusted vegetarian recipes for Love & Lemons and has been featured in US News and World Report and New York Magazine.","sameAs":["https://www.loveandlemons.com/phoebe-moore/"],"image":["https://cdn.loveandlemons.com/wp-content/themes/loveandlemons6/images/phoebe720x720.jpg","https://cdn.loveandlemons.com/wp-content/themes/loveandlemons6/images/phoebe720x540.jpg","https://cdn.loveandlemons.com/wp-content/themes/loveandlemons6/images/phoebe720x404.jpg"],"url":"https://www.loveandlemons.com/phoebe-moore/"}],"description":"The ultimate recipe for brownies! They&#x27;re fudgy, moist, and super chocolaty, with perfect crispy edges. From Weeknight Baking by Michelle Lopez.","datePublished":"2020-01-28T08:34:41+00:00","image":["https://cdn.loveandlemons.com/wp-content/uploads/2020/01/brownie-recipe-500x500.jpg","https://cdn.loveandlemons.com/wp-content/uploads/2020/01/brownie-recipe-500x375.jpg","https://cdn.loveandlemons.com/wp-content/uploads/2020/01/brownie-recipe-480x270.jpg","https://cdn.loveandlemons.com/wp-content/uploads/2020/01/brownie-recipe.jpg"],"recipeYield":["16","16 brownies"],"prepTime":"PT5M","cookTime":"PT45M","recipeIngredient":["1 1/2 cups granulated sugar*","3/4 cup all-purpose flour","2/3 cup cocoa powder (sifted if lumpy)","1/2 cup powdered sugar (sifted if lumpy)","1/2 cup dark chocolate chips","3/4 teaspoons sea salt","2  large eggs","1/2 cup canola oil or extra-virgin olive oil**","2 tablespoons water","1/2 teaspoon vanilla"],"recipeInstructions":[{"@type":"HowToStep","text":"Preheat the oven to 325°F. Lightly spray an 8x8 baking dish (not a 9x9 dish or your brownies will overcook) with cooking spray and line it with parchment paper. Spray the parchment paper.","name":"Preheat the oven to 325°F. Lightly spray an 8x8 baking dish (not a 9x9 dish or your brownies will overcook) with cooking spray and line it with parchment paper. Spray the parchment paper.","url":"https://www.loveandlemons.com/brownies-recipe/#wprm-recipe-42107-step-0-0"},{"@type":"HowToStep","text":"In a medium bowl, combine the sugar, flour, cocoa powder, powdered sugar, chocolate chips, and salt.","name":"In a medium bowl, combine the sugar, flour, cocoa powder, powdered sugar, chocolate chips, and salt.","url":"https://www.loveandlemons.com/brownies-recipe/#wprm-recipe-42107-step-0-1"},{"@type":"HowToStep","text":"In a large bowl, whisk together the eggs, olive oil, water, and vanilla.","name":"In a large bowl, whisk together the eggs, olive oil, water, and vanilla.","url":"https://www.loveandlemons.com/brownies-recipe/#wprm-recipe-42107-step-0-2"},{"@type":"HowToStep","text":"Sprinkle the dry mix over the wet mix and stir until just combined.","name":"Sprinkle the dry mix over the wet mix and stir until just combined.","url":"https://www.loveandlemons.com/brownies-recipe/#wprm-recipe-42107-step-0-3"},{"@type":"HowToStep","text":"Pour the batter into the prepared pan (it&#39;ll be thick - that&#39;s ok) and use a spatula to smooth the top. Bake for 40 to 48 minutes, or until a toothpick comes out with only a few crumbs attached (note: it&#39;s better to pull the brownies out early than to leave them in too long). Cool completely before slicing.*** Store in an airtight container at room temperature for up to 3 days. These also freeze well!","name":"Pour the batter into the prepared pan (it&#39;ll be thick - that&#39;s ok) and use a spatula to smooth the top. Bake for 40 to 48 minutes, or until a toothpick comes out with only a few crumbs attached (note: it&#39;s better to pull the brownies out early than to leave them in too long). Cool completely before slicing.*** Store in an airtight container at room temperature for up to 3 days. These also freeze well!","url":"https://www.loveandlemons.com/brownies-recipe/#wprm-recipe-42107-step-0-4"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.81","ratingCount":"8220","reviewCount":2934},"recipeCategory":["Dessert"],"recipeCuisine":["American"],"keywords":"Brownie recipe, Brownies, Recipe for brownies","@id":"https://www.loveandlemons.com/brownies-recipe/#recipe","review":[{"@type":"Review","datePublished":"2026-09-27 14:46:07","reviewBody":"These are the best brownies I’ve ever had! I use the special dark cocoa in these and maybe that’s why they are so special and stand out so much besides the fact that it’s your delicious recipe of course.","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Carrie Flankey"}},{"@type":"Review","datePublished":"2026-09-27 13:43:14","reviewBody":"I've tried many a Brownie recipe and this one is by far the best I have come across in terms of ease, taste profile, and speed! Super moist and gooey, just the way my family loves it!","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Rebecca"}},{"@type":"Review","datePublished":"2026-09-27 02:41:28","reviewBody":"This was my 1st time making homemade brownies and this recipe was awesome friends didn't believe I made them, thanks for this super gooey recipe!","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"MARCUS"}},{"@type":"Review","datePublished":"2026-09-25 02:12:16","reviewBody":"Love this recipe, but I found that both the sugar amount and cocoa powder amount is unecessary. I put probably 1/2 cup of granulated and a 1/4 cup of powdered sugar and it’s more than sweet enough. I also only put about 1/2 cup of cocoa powder and feel that I could probably put even less…then I sprinkle the top with crunchy sugar and sea salt. Huge hit! And really easy to make. Thank you!","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Hannah"}},{"@type":"Review","datePublished":"2026-09-20 23:13:35","reviewBody":"These brownies always turn out delicious! They’re very easy. I use olive oil as the recipe suggests and 1 cup of granulated sugar as it says it’s still good with 1 cup. These are amazing brownies! Thanks for this recipe.","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Carrie Felice Crowl"}},{"@type":"Review","datePublished":"2026-09-19 23:33:14","reviewBody":"I never leave comments but I’ve made these twice now once just as the recipe says and the second time doubled because the first batch was devoured! \r\nExcellent recipe! Definitely being added to the recipe book!","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Melissa"}},{"@type":"Review","datePublished":"2026-09-16 21:14:52","reviewBody":"I made these for a birthday party at work. They are delicious! I made them in silicone mini cupcake pans so they would be easier to eat. Baked them for about 22 min. @ 325°\r\nWow...everyone loved them💜","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Kay"}},{"@type":"Review","datePublished":"2026-09-16 15:29:58","reviewBody":"These have been my go-to brownie recipe for years -- I've made them dozens and dozens of times! They are practically perfect for my preferences, especially when I use olive oil and then sprinkle flakey sea salt on them at the end.  They're thick, dense, and fudgey, and I everyone asks me for the recipe.  10/10. Note: if you care about the crinkle top, these don't have one, but the taste makes up for the lack of a crinkle, don't worry about it.  Also, I don't think these are too sweet -- they're a brownie for goodness sakes, they have the exact balance of chocolate and sweet I'd expect from a brownie as someone living in the US.","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Cait"}},{"@type":"Review","datePublished":"2026-09-16 07:00:57","reviewBody":"Really easy recipe to follow. Definitely a sweeter brownie so if that isn’t for you then this recipe probably won’t be one you like. That being said I have a sweet tooth and the warm brownie pairs perfectly with vanilla ice cream or a glass of milk which was what I wanted","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"G-unit"}},{"@type":"Review","datePublished":"2026-09-14 22:37:27","reviewBody":"great with a little bit of peanut butter swirled into the batter once it's poured into the dish :D","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"a.w."}}]}]}</script>
