<meta name="description" content="467 likes, 8 comments - vegan_govegan am December 2, 2023: &quot;Easy Overnight Bread Rolls &#x1f468;&#x1f3fc;&#x200d;&#x1f373;

By &#064;herbifoods 

Recipe:

(8 rolls)
- 350 g all purpose flour (or more whole wheat flour)
- 150 g whole wheat/spelt flour
- 370 g water
- 4 g instant yeast (or 12 g fresh yeast)
- 10 g salt
&#x2800;
- mixed seeds as topping
&#x2800;&#x2028;&#x2776; Mix all ingredients for the dough until no dry spots remain. Cover and let it rest for 15 minutes.
&#x2777; Stretch &amp; fold the dough once, then cover and let it rest in the fridge overnight or up to 48 hours.
&#x2778; Preheat a baking tray or pizza stone/steel to 250&#xb0;C.
&#x2779; Using a dough scraper release the dough from the bowl. Place on a well floured surface and cut into 8 pieces. Optionally roll the dough in mixed seeds.
&#x277a; Place the rolls on the preheated baking tray, (spritz with water) and bake (preferably with steam) for 12 minutes. Reduce the heat to 230&#xb0;C and remove the steam and bake until they&#x2019;ve got your desired color.
&#x277b; Let the rolls cool for at least 30 minutes, enjoy!
