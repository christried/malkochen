document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

><span style=\"font:500 14px/1.4 'Figtree',system-ui;text-wrap:pretty\">„{{ x.v }}“<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:22px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font:600 11px ui-monospace,monospace;padding:3px 7px;border-radius:5px;background:#1a1a1a;color:#fff\">10<\u002Fspan><span style=\"font:500 34px/1.1 'Petrona',Georgia,serif;letter-spacing:-.02em\">Where I decided differently<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px\">\n      <sc-for list=\"{{ decisions }}\" as=\"x\" hint-placeholder-count=\"8\">\n        <div style=\"display:flex;flex-direction:column;gap:5px;padding:15px 17px;border-radius:20px;background:{{ x.bg }}\"><span style=\"font:600 14px/1.35 'Figtree',system-ui\">{{ x.t }}<\u002Fspan><span style=\"font:13.5px/1.5 'Figtree',system-ui;color:#3F3C37;text-wrap:pretty\">{{ x.d }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font:600 11px ui-monospace,monospace;padding:3px 7px;border-radius:5px;background:#1a1a1a;color:#fff\">11<\u002Fspan><span style=\"font:500 34px/1.1 'Petrona',Georgia,serif;letter-spacing:-.02em\">Handoff<\u002Fspan><a href=\"handoff/README.md\" style=\"font:600 12px ui-monospace,monospace;color:#8A857D\">README §11 →<\u002Fa><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px\">\n      <sc-for list=\"{{ files }}\" as=\"f\" hint-placeholder-count=\"8\">\n        <a href=\"{{ f.href }}\" style=\"display:flex;flex-direction:column;gap:5px;padding:14px 16px;border-radius:20px;background:#fff\" style-hover=\"box-shadow:0 0 0 2px #EFEDE8\"><span style=\"font:600 12px/1.4 ui-monospace,monospace;word-break:break-all\">{{ f.p }}<\u002Fspan><span style=\"font:13px/1.5 'Figtree',system-ui;color:#55524C;text-wrap:pretty\">{{ f.d }}<\u002Fspan><\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;frame&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;phone&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;zoom&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[0.5,0.75,1],&quot;default&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;reducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;slowMo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst UI = ['UI MOTION', '#FBE3B0'], MG = ['MOTION GRAPHIC', '#F2D2F9'], NO = ['NO OWN MOTION', '#EFEDE8'];\nconst S = (id, k, t, d, kind, m, r) => ({ id, k, t, d, kind: kind[0], kindBg: kind[1], m, r });\nconst VIEW = [\n  S('1a', 'list', 'Einkauf, the third view', 'Phone: the switch now spans its whole row under the top bar, 328 × 40, three equal segments of 109px with icon and label: \"Spalten\", \"Woche\", \"Einkauf\". Desktop: still right after the Board pill, 348 × 44 (116 per segment, as before). Remembered per device as in R14. The list: \"Einkaufsliste\" as the view title, \"Erledigte entfernen\" beside it while anything is ticked, then \"Sonstiges\" first and one group per Dish below, newest last. Each line is a full-width row with a pebble checkbox; ticked lines are crossed out and sit at the bottom of their group (Spülmittel, Penne, Cashews). The FAB adds a line (4a). Desktop: Sonstiges has its own 360px column with the field always there; the Dish groups flow into two columns beside it (2a).', UI, 'Press on a segment: tap. Rows: press scale .98 (tap). The view change is 1b.', 'Press without scale.'),\n  S('1b', 'switch', 'Woche to Einkauf and back', 'The frame loops it. The thumb slides on to the third segment, the week steps aside and the groups come in one after the other. Einkauf always opens at the top, with Sonstiges in view. The FAB, hidden in Woche since R14, comes back as \"Eintrag hinzufügen\".', UI, 'See Interaction \"Switch to the list\". Thumb: left → 66.6%, settle 480. Week: fade 240 + x 0 → −28 (settle 480). List: x +28 → 0 (settle 480); groups opacity 0 → 1 and y 14 → 0, staggered 40ms from +140ms. FAB: scale 0 → 1 (pop 460, +200ms). Back: groups drop out together (160), the FAB shrinks (150).', 'The thumb jumps and the two views crossfade in 200ms; the FAB appears with them. No shift, no stagger.')\n];\nconst LIST = [\n  S('2a', 'more', 'Twice, long and gone', 'Phone, scrolled to the end. Crispy Tofu Bowl was put on twice: still one group, its lines in Recipe order with each line twice side by side, and a quiet \"Zweimal auf der Liste\" under the title. The long tofu line wraps freely, the checkbox stays at its first line. Veganer Käsekuchen has left the Board: its group keeps the title with \"Nicht mehr auf dem Board\" under it, no image, no chevron, nothing to open; its lines tick and go like all others. Desktop: each new Dish group goes into the shorter of the two Dish columns, so the order still reads left to right, top to bottom. Hover on a Dish heading (Pasta) fills it surface-muted and darkens the chevron; a click opens the Dish detail.', UI, 'Dish heading: press scale .98 (tap), then the card to detail morph with the group image as the shared element.', 'Press without scale; the detail crossfades in 200ms.'),\n  S('2b', 'empty', 'An empty list', 'One card says how things get on the list, in three lines with an icon each: from a Dish, from the Week Plan, or typed. Topfbert winks beside \"Noch nichts zu kaufen.\" (section 08). Phone: \"Etwas aufschreiben\" opens the same field as the FAB. Desktop: the 520px card sits centred with the field already in it and focused, so typing starts straight away. No \"Erledigte entfernen\" here.', MG, 'Topfbert wink, built in Vue from the R12 layers: breathe, steam, one-eyed blink and the hat tip on the shared 6 s clock. The card pops in once (pop 460, +200ms). Paused off screen and under sheets.', 'Topfbert as the still (frame 0); the card fades in 200ms.'),\n  S('2c', 'offline', 'Without a connection', 'Everything works offline and is sent once the connection is back. Here \"Hafermilch\" was typed and \"1 Zwiebel\" ticked offline: each carries the existing quiet mark, the cloud and \"Noch nicht gesendet\", under its text, as on the Dish card and the Planned Dish. A deleted or cleared line has nothing left to mark; it goes with the next send. When two Members change the same line, the later change wins; a line deleted elsewhere stays deleted.', UI, 'The mark fades in and out (fade 240) and leaves by itself once sent. A ticked line sinks as always (3a).', 'The mark appears and disappears instantly.')\n];\nconst TICK = [\n  S('3a', 'tick', 'Tick, and it sinks', 'The whole row is the target: full width, at least 56px tall (50 on desktop), so a thumb can hit it without looking twice. Here \"2 Karotten\". The pebble springs and fills sage, the check draws, a line runs through the text and it turns text-muted. After a short 600ms pause, long enough to see a wrong tap and untick in place, the line sinks to the bottom of its group and the lines below move up. A light haptic tick on release.', UI, 'See Interaction \"Tick\". Press scale .98 (tap). Pebble .82 → 1.18 → 1 (pop 380), fill sage 180, check stroke 220 from +60, strike 0 → 100% 260 from +80, text colour 200. Hold 600, then the line travels to its new place and the others close up (settle 480). Haptic SELECTION.', 'Fill, check and strike appear at once; after the same 600ms the line jumps to its place.'),\n  S('3b', 'untick', 'Untick, and it comes back', '\"2 Karotten\" from the bottom of the group: tap, the check and the strike retract, and the line goes back to its Recipe place between \"1 Dose gehackte Tomaten\" and \"1 Zwiebel\". In Sonstiges a line goes back to the order it was typed in.', UI, 'See Interaction \"Untick and rise\". Check retracts (stroke 160), strike 100 → 0% (200), colour 200. Hold 600, then travel (settle 480). Haptic SELECTION.', 'Everything changes at once; the line jumps back after 600ms.')\n];\nconst CHANGE = [\n  S('4a', 'type', 'Typing several in a row', 'Phone: in Einkauf the FAB adds a line. It opens a field docked on the keyboard, labelled \"Neu in Sonstiges\" with \"Was fehlt noch?\" as placeholder; the return key says \"Weiter\". Enter adds the line at the end of Sonstiges\\' open lines, clears the field and keeps keyboard and focus. Enter on an empty field, a tap outside or the keyboard swiped down closes it. Desktop: the field lives in the Sonstiges column; \"n\" focuses it from anywhere in the view (\"/\" stays search). The loop types \"Tomatenmark\" and \"Zitronen\".', UI, 'See Interaction \"Type items in a row\". The field rises with the keyboard (system timing). On Enter: a slot opens 0 → 56 (settle 380) and the line drops in from y −10 and .97 (settle 460, +80). The field clears without motion. Haptic none.', 'The line appears in place.'),\n  S('4b', 'edit', 'Changing a line', 'Phone: long-press a line (450ms, haptic LONG_PRESS). The row turns into our Input in place, labelled \"Eintrag ändern\", text selected, with a delete button inside the field; \"Fertig\" or a tap outside saves. Saving an empty text deletes the line, with the delete toast. Desktop: the pencil that appears on hover and focus, Enter on a focused line, or a double click; Escape cancels. The line keeps its place, and a ticked line stays ticked.', UI, 'Row to field: crossfade 150, outline 180 (Input). Back: crossfade 150.', 'The row and the field swap without motion.'),\n  S('4c', 'delete', 'Deleting a line', 'Phone: swipe a line left. From 96px \"Entfernen\" shows on danger; let go past half the width or with a quick flick and it goes, shorter swipes spring back. The edit field\\'s delete button and the accessibility action do the same without a gesture. Desktop: the trash on hover and focus, or Delete on a focused line. It acts at once, toast \"Eintrag entfernt.\" with \"Rückgängig\". The last line of a group takes the group with it; undo brings both back.', UI, 'See Interaction \"Delete with undo\". The row follows the finger; past 96px haptic GESTURE_THRESHOLD_ACTIVATE. Release: x → −105% (240 ease-in), the slot closes 56 → 0 (settle 380, +220). Desktop: x −24 and fade (200 ease-in), slot closes (+180). Toast in (settle 400, +260), the FAB moves up 76. Undo: the slot reopens and the line drops back (as 4a).', 'The line fades out in 200ms and the gap closes at once; the toast fades in.'),\n  S('4d', 'clear', '\"Erledigte entfernen\"', 'In the list header, only while something is ticked; with nothing ticked it isn\\'t there at all. One tap clears every ticked line in every group, for everyone, with no dialog: toast \"3 Einträge entfernt.\" with \"Rückgängig\". Groups left without lines disappear with them.', UI, 'See Interaction \"Clear ticked with undo\". Press scale .94 (tap). Ticked lines fade (160) and their slots close (settle 380), 30ms apart from top to bottom, from +140ms. The button fades out (200, +120). Toast in (settle 400, +200). Undo: the lines grow back in place (settle 380) and the button returns (fade 240).', 'Lines and button disappear at once; the toast fades in.')\n];\nconst DISH = [\n  S('5a', 'detail', '\"Auf die Einkaufsliste\" in the Dish detail', 'The share row is full at 328px with \"Einplanen\", \"Link teilen\" and \"Kopieren\", and a fourth item would wrap. So the action sits where its content is: a full-width secondary button closing the Zutaten card, 48px, with the bag-plus icon. It only exists when the Recipe has Ingredients. The phone frame is scrolled to the card; desktop shows the panel the same way.', UI, 'Press scale .94 (tap). Opens 5b.', 'Press without scale.'),\n  S('5b', 'ingpick', 'Choosing what goes on', 'Phone: content-height sheet. Desktop: a 400px popover rising from the button inside the panel, like R14\\'s pickers. \"Auf die Einkaufsliste\", the Dish under it, then \"Nimm raus, was du schon zu Hause hast.\" and every Ingredient line as written, all ticked. The whole row toggles. With \"2 EL Sojasoße\", \"2 EL Öl\" and \"1 Prise Salz\" unticked, the button says \"5 Zutaten hinzufügen\" and counts along as you tap.', UI, 'Phone: Sheet open (Interaction \"Sheet open / close\"). Desktop: pop 360 from the button (scale .96 → 1, y +8 → 0, origin bottom). Rows rise 14px with a 40ms stagger, max 8. Toggle: fill 180, check stroke 200. The count in the button changes without motion.', 'Fade 200ms, no slide, no stagger.'),\n  S('5c', 'ingzero', 'Nothing left ticked', 'The button stays where it is, at 35%, and says why instead of \"0 Zutaten hinzufügen\": \"Keine Zutat ausgewählt\".', NO, 'Label swap only.', 'Nothing to reduce.'),\n  S('5d', 'ingdone', 'On the list', 'The frame loops it: the button is pressed, the sheet closes, toast \"5 Zutaten auf der Einkaufsliste.\" with \"Rückgängig\". The lines go into this Dish\\'s group at the end of the list. Doing it again adds the lines again to the same group, and its heading then says \"Zweimal auf der Liste\".', UI, 'See Interaction \"Put a Dish on\". Button press .97, sheet close 320 ease-in (desktop popout 200), toast in (settle 400, +200). Haptic CONFIRM.', 'The sheet fades out, the toast fades in.')\n];\nconst WEEK = [\n  S('6a', 'week', '\"Woche auf die Einkaufsliste\" on the Week Plan', 'Phone: a labelled ghost button as a second header line, under the week title and aligned with it. The title row has no room left beside ‹ ›, and a bare bag icon would read as a shop. Desktop: a secondary pill in the header before \"Heute\" and the arrows. It takes every Dish planned from today to Sunday; in a week to come, the whole week. Here that is Mi to So: Räuchertofu, Crispy Tofu Bowl, Pad Thai, Linsensuppe, Gyoza, Tacos, Brunch.', UI, 'Press scale .94 (tap). The ring marks the button about to be tapped.', 'Press without scale.'),\n  S('6b', 'weekdone', 'The week goes on the list', 'No sheet: four Dishes go on with all their Ingredients. Crispy Tofu Bowl and Omas Linsensuppe are skipped because they already have a group, the Brunch because it has no Ingredients. Each Dish gets its group in plan order (day, then place in the day). Toast \"4 Gerichte auf der Einkaufsliste.\" with \"Rückgängig\", which takes all four off again.', UI, 'See Interaction \"Put a week on\". Press .94 (tap), the bag icon squashes 1.3/.84 → 1 (pop 460), the days that were looked at get a butter ring pulse, 40ms apart (900 ease-out), so you can see what \"Woche\" covered. Toast in (settle 400, +120). Haptic CONFIRM.', 'No squash, no pulse; the toast fades in.'),\n  S('6c', 'weeknone', 'Nothing left to add', 'Tapping it again, or for a week where every planned Dish is already on the list or has no Ingredients: \"Alles schon auf der Einkaufsliste.\" No undo, because nothing changed.', UI, 'Press and squash as 6b, no pulse. Toast in (settle 400), 3 s without the undo bar.', 'The toast fades in.'),\n  S('6d', 'weekpast', 'A past week', '9. bis 15. November: no button, since nothing in it can still be bought for. The header is one line again and the days start right below it.', NO, 'Browsing weeks as in R14; the second header line fades with the week (fade 240).', 'Swaps without motion.')\n];\nconst PARTS = [\n  { ...S('7a', 'parts', 'ShoppingItem and ShoppingGroup', 'Phone: ticked, a long line that wraps, not sent yet, swiping, editing; then the four group headings: Sonstiges, a Dish, a Dish put on twice, a Dish that has left the Board. Desktop adds hover (pencil and trash), keyboard focus, removing, and Sonstiges with its field. Rows are 56 (phone) and 50 (desktop) per line of text.', UI, 'Per state as listed in components.json → ShoppingItem and ShoppingGroup.', 'As listed there.'), parts: 1 }\n];\nconst LAYERS = [\n  ['whole', 'breathe: scale 1 → .985 / 1.025, twice per loop', 'r11-breathe 3s ease-in-out · pivot 70 123'],\n  ['steam_1, steam_2', 'R11 idle steam, half a loop apart', 'r11-steam 3s ease-out · phase 0 / −1.5s'],\n  ['eyes / eyes_closed', 'left eye only: the shared blink', 'r11-ieo / r11-iec 6s linear'],\n  ['wink', 'static: the right eye stays closed', '—'],\n  ['hat', 'tip: y −2.5 and −4° at 46–54%, small overshoot, rest by 64%', 'r12-tip 6s ease-in-out · pivot 18 36'],\n  ['mirror', 'not mirrored: the card text is on his right', 'layers.json → shoppingEmpty.mirror false'],\n  ['size', 'phone 78 × 84, desktop 100 × 107 (viewBox 0 -20 140 150)', 'layers.json → shoppingEmpty.size'],\n  ['reduced', 'no loop, no blink: frame 0', 'topfbert-wink.svg = the still'],\n  ['pause', 'off screen, under a sheet or dialog, app in background', 'shared clock keeps time']\n];\nconst COPY = [\n  ['VIEW SWITCH', 'Einkauf / Liste', '„Einkauf“ (EN „Shopping“, IT „Spesa“).', '\"Liste\" is ambiguous on a Board where every Column is a list. \"Einkaufsliste\" doesn\\'t fit a third of 328px with its icon. \"Einkauf\" says where you are going.'],\n  ['DISH DETAIL', 'Auf die Einkaufsliste', '„Auf die Einkaufsliste“ (kept). Sheet: same title, the Dish under it, „Nimm raus, was du schon zu Hause hast.“, button „5 Zutaten hinzufügen“ / „1 Zutat hinzufügen“, at 0 „Keine Zutat ausgewählt“.', 'The hint says the one thing to do in the sheet. At 0 the button tells why it is off instead of counting to zero.'],\n  ['TOAST AFTER A DISH', '5 Zutaten auf der Einkaufsliste.', '„5 Zutaten auf der Einkaufsliste.“ with „Rückgängig“; „1 Zutat auf der Einkaufsliste.“', 'Kept, plus the undo every change has.'],\n  ['WEEK', 'Woche auf die Einkaufsliste', '„Woche auf die Einkaufsliste“, toast „4 Gerichte auf der Einkaufsliste.“ / „1 Gericht auf der Einkaufsliste.“ with „Rückgängig“, or „Alles schon auf der Einkaufsliste.“ without.', 'Kept. \"Alles schon\" has no undo because nothing happened.'],\n  ['DELETE / CLEAR', 'Eintrag entfernt. / Erledigte entfernen / 3 Einträge entfernt.', '„Eintrag entfernt.“, „Erledigte entfernen“, „3 Einträge entfernt.“ / „1 Eintrag entfernt.“, each toast with „Rückgängig“.', 'Kept. \"Erledigte\" is what people say about ticked things.'],\n  ['EMPTY LIST', '(new)', '„Noch nichts zu kaufen.“, „So kommt etwas auf die Liste:“, „Im Gericht holst du seine Zutaten dazu.“, „Im Wochenplan kommt die ganze Woche auf einmal.“, „Oder du schreibst selbst etwas auf.“, button „Etwas aufschreiben“.', 'Short sentences, one per way in, in the order people meet them.'],\n  ['GROUP HEADINGS', '(new)', '„Sonstiges“ (kept), „Zweimal auf der Liste“ / „Dreimal auf der Liste“ / „{n}-mal auf der Liste“, „Nicht mehr auf dem Board“.', 'Plain facts, no warning tone for the Dish that left.']\n];\nconst STRINGS = [\n  ['Switch', 'Einkauf'], ['View title', 'Einkaufsliste'], ['Header', 'Erledigte entfernen'], ['Group', 'Sonstiges'], ['', 'Zweimal auf der Liste'], ['', 'Dreimal auf der Liste'], ['', '{n}-mal auf der Liste'], ['', 'Nicht mehr auf dem Board'],\n  ['Item · unsent', 'Noch nicht gesendet'], ['Item · swipe', 'Entfernen'], ['Field', 'Neu in Sonstiges'], ['', 'Was fehlt noch?'], ['', 'Eintrag ändern'], ['Keyboard · return', 'Weiter'], ['', 'Fertig'],\n  ['FAB · aria', 'Eintrag hinzufügen'], ['Item · aria', '2 Karotten, Omas Linsensuppe, nicht erledigt'], ['', '2 Karotten, erledigt'], ['Item · actions', 'Ändern'], ['', 'Entfernen'], ['Group · aria', 'Omas Linsensuppe öffnen'],\n  ['Toast', 'Eintrag entfernt.'], ['', '3 Einträge entfernt.'], ['', '1 Eintrag entfernt.'], ['', 'Rückgängig'],\n  ['Empty', 'Noch nichts zu kaufen.'], ['', 'So kommt etwas auf die Liste:'], ['', 'Im Gericht holst du seine Zutaten dazu.'], ['', 'Im Wochenplan kommt die ganze Woche auf einmal.'], ['', 'Oder du schreibst selbst etwas auf.'], ['', 'Etwas aufschreiben'],\n  ['Detail', 'Auf die Einkaufsliste'], ['Picker', 'Nimm raus, was du schon zu Hause hast.'], ['', '5 Zutaten hinzufügen'], ['', '1 Zutat hinzufügen'], ['', 'Keine Zutat ausgewählt'], ['Toast', '5 Zutaten auf der Einkaufsliste.'], ['', '1 Zutat auf der Einkaufsliste.'],\n  ['Week', 'Woche auf die Einkaufsliste'], ['Toast', '4 Gerichte auf der Einkaufsliste.'], ['', '1 Gericht auf der Einkaufsliste.'], ['', 'Alles schon auf der Einkaufsliste.'],\n  ['Live region', '2 Karotten erledigt.'], ['', '2 Karotten wieder offen.'], ['', 'Tomatenmark hinzugefügt.']\n];\nconst DEC = [\n  ['\"Einkauf\" for the third segment', 'Not \"Liste\" (every Column is a list) and not \"Einkaufsliste\" (too long for 109px with its icon). EN \"Shopping\", IT \"Spesa\". If a translation ever runs longer, the icons drop first, the labels stay.'],\n  ['Phone: the switch takes the whole row', '328 × 40 in three equal segments instead of 212 for two. Desktop keeps 116 per segment, now 348.'],\n  ['The FAB adds a line', 'In Einkauf the FAB is \"Eintrag hinzufügen\" and opens a field docked on the keyboard. No field sitting at the top of the list on the phone: in the shop the list is for ticking, and a permanent field would push the lines down and catch stray taps. Desktop has the field in place.'],\n  ['\"Auf die Einkaufsliste\" closes the Zutaten card', 'Not in the share row, which is full at 328px. It sits right under the lines it puts on, and only exists when there are Ingredients.'],\n  ['One group per Dish, also twice', 'A Dish put on again keeps its group: the lines double side by side in Recipe order and the heading says \"Zweimal auf der Liste\". Two groups with the same title would read as a mistake.'],\n  ['Week button on the phone is a labelled second line', 'Under the title, not an icon in the title row: there is no room beside ‹ › and the action needs its words.'],\n  ['Twice in the week means twice on the list', 'A Dish planned twice between today and Sunday goes on twice, as cooking twice means buying twice. What already has a group before the tap is skipped, so tapping twice is harmless.'],\n  ['Desktop: Sonstiges column plus two Dish columns', 'Lines stay 360 to 420px wide. Sonstiges and its field have a fixed column; Dish groups go into the shorter of two columns, in order.'],\n  ['600ms before a ticked line sinks', 'So a wrong tap can be undone right where it happened. Unticking brings a line back to its Recipe place, a typed line to its typing order.'],\n  ['\"Erledigte entfernen\" is hidden, not disabled', 'A greyed button would be one more thing to read in a shop.'],\n  ['Long-press 450ms to edit', 'Longer than R14\\'s 300ms for dragging: a thumb resting on the list in the shop should not open a field. Swipe to delete is a shortcut; the field\\'s delete button and the accessibility actions are the ways without gestures.'],\n  ['An emptied text deletes the line', 'Saving \"\" removes it with the delete toast and its undo.'],\n  ['Empty list: wink, no new art', 'Topfbert wink from R12 with its layers and idle. layers.json gets placement and size only.'],\n  ['Ticked lines stay until cleared', 'No automatic clean-up: the next person in the shop sees what is already in the basket.'],\n  ['Open, not designed', 'When a Dish\\'s Recipe changes after it was put on, the list keeps the old lines (they are text as written). Suggestion: leave it so.']\n];\nconst FILES = [\n  ['../Malkochen Shopping List.dc.html', 'This page. Frames: ShopScreen.dc.html (every phone and desktop state, light and dark, with props screen, frame, theme, still, spd).', 'Malkochen Shopping List.dc.html'],\n  ['handoff/components.json', '6 new components with variants, states, UI motion and tokens: ShoppingList, ShoppingGroup, ShoppingItem, ShoppingItemInput, IngredientPicker, EmptyShoppingList. ViewSwitch, WeekHeader, Toast, BottomSheet, Button and RecipeSection get an r15 note.', 'handoff/components.json'],\n  ['handoff/interactions.json', '9 new: Tick, Untick and rise, Delete with undo, Clear ticked with undo, Type items in a row, Change a line, Put a Dish on, Put a week on, Switch to the list. Each with a ms timeline and reduced motion.', 'handoff/interactions.json'],\n  ['handoff/tokens.json · tokens.css · tailwind.preset.js', 'Additions only: color.derived.tick, tick-ink, strike, swipe-danger (light + dark), size.shop-row, shop-row-desktop, shop-check, layout.shopping, motion.sink-hold, z.shop-field. CSS variables and Tailwind keys to match.', 'handoff/tokens.json'],\n  ['handoff/assets/r15-keyframes.css', 'Every r15-* keyframe used above: check, press, grow, arrive, squash, wash, pop.', 'handoff/assets/r15-keyframes.css'],\n  ['handoff/assets/topfbert/layers.json → shoppingEmpty', 'Placement, size and loop for Topfbert wink in the empty list. Additions only, no new SVG.', 'handoff/assets/topfbert/layers.json'],\n  ['handoff/README.md → §11 R15', 'What is new, what each file is for, every decision that differs from the brief.', 'handoff/README.md']\n];\nclass Component extends DCLogic {\n  state = {};\n  componentDidMount() {\n    const poll = () => {\n      const vh = window.innerHeight || 800; let dirty = false;\n      const S = window.__r15set || (window.__r15set = {});\n      document.querySelectorAll('[data-card]').forEach(el => { const r = el.getBoundingClientRect(), on = r.bottom > -vh * 1.5 && r.top < vh * 2.5; if (!!S[el.id] !== on) { S[el.id] = on ? 1 : 0; dirty = true; } });\n      if (dirty && window.__r15inst) window.__r15inst.forceUpdate();\n    };\n    if (window.__r15poll) { document.removeEventListener('scroll', window.__r15poll, true); window.removeEventListener('scroll', window.__r15poll); }\n    window.__r15poll = poll;\n    document.addEventListener('scroll', poll, true); window.addEventListener('scroll', poll); window.addEventListener('resize', poll);\n    clearInterval(window.__r15iv); window.__r15iv = setInterval(poll, 500);\n    poll();\n  }\n  renderVals() {\n    window.__r15inst = this;\n    const frame = this.state.frame ?? this.props.frame ?? 'phone', theme = this.state.theme ?? this.props.theme ?? 'both';\n    const rm = this.state.rm ?? !!this.props.reducedMotion, spd = (this.state.slow ?? !!this.props.slowMo) ? 2 : 1;\n    const z = this.state.zoom ?? this.props.zoom ?? 0.5;\n    const ths = theme === 'both' ? ['light', 'dark'] : [theme];\n    const N = window.__r15set || (window.__r15set = { '1a': 1 });\n    const desk = frame === 'desktop';\n    const gate = s => {\n      const ph = !desk, fh = s.parts ? (ph ? 760 : 520) : (ph ? 760 : 800), fw = ph ? 360 : 1280, zz = ph ? 1 : z;\n      return { ...s, on: !!N[s.id], z: String(zz), fw: fw + 'px', fh: fh + 'px', bw: Math.round(fw * zz) + 'px', bh: Math.round(fh * zz) + 'px', br: ph ? '36px' : '12px',\n        frames: ths.map(th => ({ th, label: `${s.id} · ${th === 'light' ? 'Light' : 'Dark'} · ${ph ? 'Phone 360' : 'Desktop 1280 at ' + Math.round(zz * 100) + '%'}` })) };\n    };\n    const seg = (key, cur, opts) => ({ opts: opts.map(([v, l]) => ({ l, bg: cur === v ? '#1F1E1C' : 'transparent', fg: cur === v ? '#fff' : '#1F1E1C', go: () => this.setState({ [key]: v }) })) });\n    const ctrls = [seg('frame', frame, [['phone', 'Phone 360'], ['desktop', 'Desktop 1280']])];\n    if (desk) ctrls.push(seg('zoom', z, [[0.5, '50%'], [0.75, '75%'], [1, '100%']]));\n    ctrls.push(seg('theme', theme, [['both', 'Hell + Dunkel'], ['light', 'Hell'], ['dark', 'Dunkel']]), seg('rm', rm, [[false, 'Bewegung'], [true, 'Reduziert']]), seg('slow', spd === 2, [[false, '1×'], [true, '½×']]));\n    return {\n      rm, spd, frame, ctrls,\n      sections: [\n        { n: '01', t: 'Spalten, Woche and Einkauf', d: 'One Shopping List per Board, the same for every Member, as a third view beside the Columns and the Week Plan. Everyone may change it and no line carries a name. A line is text as written: nothing is added up or merged, so two Dishes needing flour give two lines.', states: VIEW },\n        { n: '02', t: 'The list', d: '\"Sonstiges\" first, then one group per Dish in the order they were put on, newest last. Inside a group the lines keep the Recipe\\'s order; ticked lines sink to the bottom of their group. No reordering by hand.', states: LIST },\n        { n: '03', t: 'Ticking', d: 'The main action, done in a shop with one hand and maybe bad light: the whole row is the target and the tick is felt as well as seen.', states: TICK },\n        { n: '04', t: 'Changing the list', d: 'Typing, changing and deleting a line, and clearing everything that is ticked. Every removal acts at once and offers an undo, never a question.', states: CHANGE },\n        { n: '05', t: 'From a Dish', d: 'A Dish\\'s Ingredients go on through a short sheet where you untick what you already have. Putting the same Dish on again adds its lines again.', states: DISH },\n        { n: '06', t: 'From the Week Plan', d: 'Everything planned from today to Sunday in one tap, without a sheet. Past weeks don\\'t offer it.', states: WEEK },\n        { n: '07', t: 'Parts', d: 'The line and the group heading in each state, phone and desktop. Nothing about the list shows on the Dish card.', states: PARTS }\n      ].map(x => ({ ...x, states: x.states.map(gate) })),\n      layers: LAYERS.map(([l, m, t]) => ({ l, m, t })),\n      copy: COPY.map(([where, draft, final, why]) => ({ where: where + ' · DRAFT', draft, final, why })),\n      strings: STRINGS.map(([k, v]) => ({ k: k || '·', v })),\n      decisions: DEC.map(([t, d], i) => ({ t, d, bg: ['#FBE3B0', '#D5E4D8', '#DCE3F0', '#E9E4F7', '#F7DCCB'][i % 5] })),\n      files: FILES.map(([p, d, href]) => ({ p, d, href }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
