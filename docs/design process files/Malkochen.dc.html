<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#F7F6F2}a{color:#1F1E1C;text-decoration:none}a:hover{color:#9B32D8}</style></helmet>
<div style="--ink:#1F1E1C;--ink2:#6F6B65;--surface:#FFFFFF;--surface2:#EFEDE8;--bg:#F7F6F2;max-width:1180px;margin:0 auto;padding:56px 40px 80px;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#1F1E1C;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:28px">
    <dc-import name="AppIcon" size="{{ 96 }}" hint-size="96px,96px"></dc-import>
    <div style="flex:1;min-width:280px;display:flex;flex-direction:column;gap:8px">
      <span style="font:400 64px/1 'Newsreader',Georgia,serif;letter-spacing:-.035em">malkochen</span>
      <span style="font:italic 400 22px/1.3 'Newsreader',Georgia,serif;color:#6F6B65">Rezepte sammeln. Zusammen kochen. · Design-Übersicht, Android first</span>
    </div>
    <dc-import name="Mascot" mood="happy" size="{{ 110 }}" style="width:110px;height:102px;--ink:#1F1E1C" hint-size="110px,102px"></dc-import>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">
    <sc-for list="{{ rounds }}" as="r" hint-placeholder-count="11">
      <a href="{{ r.href }}" style="display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:28px 24px 30px 26px;background:{{ r.bg }};transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s" style-hover="transform:translateY(-4px) rotate(-.6deg);box-shadow:0 24px 40px -20px rgba(0,0,0,.3)">
        <div style="display:flex;align-items:center;gap:10px"><span style="font:600 11px ui-monospace,monospace;padding:4px 8px;border-radius:6px;background:#1F1E1C;color:#fff">{{ r.n }}</span><span style="flex:1"></span><span style="font:600 12px/1 system-ui;opacity:.6">Öffnen →</span></div>
        <span style="font:400 27px/1.1 'Newsreader',Georgia,serif;letter-spacing:-.015em">{{ r.t }}</span>
        <span style="font:13px/1.5 system-ui;color:#3F3C37;text-wrap:pretty">{{ r.d }}</span>
      </a>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <span style="font:600 11px ui-monospace,monospace;letter-spacing:.08em;color:#8A857D">HANDOFF</span>
    <div style="display:flex;flex-wrap:wrap;gap:10px">
      <sc-for list="{{ files }}" as="f" hint-placeholder-count="4"><a href="{{ f.href }}" style="height:44px;padding:0 16px;border-radius:22px;background:#fff;border:1px solid rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;font:600 13.5px/1 system-ui" style-hover="background:#EFEDE8"><span style="font:500 12px ui-monospace,monospace;color:#8A857D">{{ f.k }}</span>{{ f.l }}</a></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['R1', 'Board', 'Richtungen 1a–1c, Mix 2a (Farbfeld kompakt), Fly-to-tab, 10×', 'Malkochen Board.dc.html', '#FBE3B0'],
      ['R2', 'Board-Zustände & Drag', '12 Zustände: Laden, leer, Suche, Drag, Menü, Picker, Toasts', 'Malkochen Board States.dc.html', '#E9E4F7'],
      ['R3', 'Gericht hinzufügen', 'Link → Lookup → Vorschau, Duplikate, ohne Link, Gespeichert', 'Malkochen Add Dish.dc.html', '#D5E4D8'],
      ['R4', 'Platzhalter-Illustrationen', '16 vegane Gerichte, Still + Loop, Picker, Handoff', 'Malkochen Placeholders.dc.html', '#DCE3F0'],
      ['R5', 'Dish-Detail & Kochen', 'Morph, Koch-Historie, Achievement, Bearbeiten, Notiz', 'Malkochen Dish Detail.dc.html', '#F7DCCB'],
      ['R6', 'Boards & Teilen', 'Switcher, neues Board, Einstellungen, Owner, Einladung', 'Malkochen Boards.dc.html', '#FBE3B0'],
      ['R7', 'Zugang & System', 'Splash, Anmelden, freischalten, Einstellungen, offline, Fehler, Icon', 'Malkochen System.dc.html', '#E9E4F7'],
      ['R8', 'Desktop & Tablet', 'Kanban, Hover, Drag zwischen Lanes, Side Panel, Dialoge, Kürzel', 'Malkochen Desktop.dc.html', '#D5E4D8'],
      ['R9', 'Motion-System', 'Prinzipien, Tokens, Katalog mit Haptik, reduzierte Bewegung, Storyboards', 'Malkochen Motion System.dc.html', '#DCE3F0'],
      ['R10', 'Handoff', 'Tokens, Komponenten, Interaktionen, 35 Remotion-Briefs, Breakpoints, Ebenen-Assets, Icons', 'Malkochen Handoff.dc.html', '#F7DCCB'],
      ['R11', 'Desktop-Review 1', '3 neue Platzhalter, Knobi + Schoti, leere Columns, Noch-nie-gekocht-Szenen, Topfbert idle, Schriften, Labels', 'Malkochen Desktop Review.dc.html', '#D5E4D8']
    ];
    return {
      rounds: R.map(([n, t, d, href, bg]) => ({ n, t, d, href, bg })),
      files: [['md', 'README', 'handoff/README.md'], ['json', 'Tokens', 'handoff/tokens.json'], ['css', 'tokens.css', 'handoff/tokens.css'], ['js', 'Tailwind-Preset', 'handoff/tailwind.preset.js'], ['json', 'Komponenten', 'handoff/components.json'], ['json', 'Interaktionen', 'handoff/interactions.json'], ['md', 'Remotion-Briefs', 'handoff/REMOTION.md'], ['json', 'Motion', 'handoff/motion.json'], ['webmanifest', 'Manifest', 'handoff/assets/icon/manifest.webmanifest']].map(([k, l, href]) => ({ k, l, href }))
    };
  }
}
</script>
</body>
</html>
