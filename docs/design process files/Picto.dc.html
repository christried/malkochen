<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
@keyframes pk-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes pk-steam{0%{opacity:0;transform:translateY(6px) scaleY(.8)}40%{opacity:.9}100%{opacity:0;transform:translateY(-12px) scaleY(1.1)}}
@keyframes pk-sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes pk-sizzle{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style></helmet>
<div style="position:relative;width:100%;height:100%;background:{{ p0 }};overflow:hidden">
<svg viewBox="0 0 100 125" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0;width:100%;height:100%">
  <ellipse cx="50" cy="98" rx="38" ry="6" style="fill:{{ p1 }}"></ellipse>
  <sc-if value="{{ kBowl }}"><path d="M16 64h68a34 32 0 0 1-68 0z" style="fill:{{ p2 }}"></path><ellipse cx="50" cy="64" rx="34" ry="6" style="fill:{{ p3 }}"></ellipse><g style="transform-box:fill-box;transform-origin:center;animation:pk-float calc(4s * var(--spd, 1)) ease-in-out infinite"><circle cx="38" cy="57" r="8" style="fill:{{ p1 }}"></circle><circle cx="54" cy="53" r="9" style="fill:{{ p3 }}"></circle><circle cx="66" cy="58" r="6" style="fill:{{ p1 }}"></circle></g></sc-if>
  <sc-if value="{{ kNoodles }}"><g style="transform-box:fill-box;transform-origin:bottom center;animation:pk-sway calc(4.6s * var(--spd, 1)) ease-in-out infinite"><line x1="60" y1="22" x2="46" y2="60" style="stroke:{{ p3 }};stroke-width:4;stroke-linecap:round"></line><line x1="72" y1="26" x2="52" y2="60" style="stroke:{{ p3 }};stroke-width:4;stroke-linecap:round"></line></g><path d="M32 64c2-11 6-11 8 0s6 11 8 0 6-11 8 0 6 11 8 0" style="fill:none;stroke:{{ p1 }};stroke-width:5;stroke-linecap:round"></path><path d="M16 66h68a34 30 0 0 1-68 0z" style="fill:{{ p2 }}"></path><ellipse cx="50" cy="66" rx="34" ry="5" style="fill:{{ p3 }}"></ellipse></sc-if>
  <sc-if value="{{ kSalad }}"><g style="transform-box:fill-box;transform-origin:bottom center;animation:pk-sway calc(5s * var(--spd, 1)) ease-in-out infinite"><ellipse cx="38" cy="56" rx="13" ry="7" transform="rotate(-32 38 56)" style="fill:{{ p1 }}"></ellipse><ellipse cx="62" cy="54" rx="14" ry="7" transform="rotate(28 62 54)" style="fill:{{ p3 }}"></ellipse><ellipse cx="50" cy="50" rx="7" ry="12" style="fill:{{ p1 }}"></ellipse></g><circle cx="56" cy="60" r="5" style="fill:{{ p3 }}"></circle><path d="M16 64h68a34 32 0 0 1-68 0z" style="fill:{{ p2 }}"></path><ellipse cx="50" cy="64" rx="34" ry="5" style="fill:{{ p3 }}"></ellipse></sc-if>
  <sc-if value="{{ kPot }}"><rect x="12" y="60" width="12" height="7" rx="3.5" style="fill:{{ p3 }}"></rect><rect x="76" y="60" width="12" height="7" rx="3.5" style="fill:{{ p3 }}"></rect><rect x="20" y="54" width="60" height="40" rx="12" style="fill:{{ p2 }}"></rect><ellipse cx="50" cy="54" rx="30" ry="5" style="fill:{{ p3 }}"></ellipse><rect x="40" y="26" width="4" height="16" rx="2" style="fill:{{ p2 }};transform-box:fill-box;animation:pk-steam calc(2.6s * var(--spd, 1)) ease-out infinite"></rect><rect x="56" y="30" width="4" height="13" rx="2" style="fill:{{ p2 }};transform-box:fill-box;animation:pk-steam calc(2.6s * var(--spd, 1)) ease-out 1.1s infinite"></rect></sc-if>
  <sc-if value="{{ kPan }}"><rect x="66" y="64" width="30" height="7" rx="3.5" transform="rotate(-10 66 64)" style="fill:{{ p3 }}"></rect><ellipse cx="42" cy="72" rx="32" ry="13" style="fill:{{ p3 }}"></ellipse><ellipse cx="42" cy="70" rx="26" ry="9" style="fill:{{ p2 }}"></ellipse><g style="transform-box:fill-box;transform-origin:center;animation:pk-sizzle calc(2.2s * var(--spd, 1)) ease-in-out infinite"><ellipse cx="33" cy="69" rx="9" ry="5.5" style="fill:{{ p1 }}"></ellipse><circle cx="33" cy="68.5" r="3" style="fill:{{ p3 }}"></circle><ellipse cx="51" cy="71" rx="8" ry="5" style="fill:{{ p1 }}"></ellipse><circle cx="51" cy="70.5" r="2.7" style="fill:{{ p3 }}"></circle></g></sc-if>
  <sc-if value="{{ kPlate }}"><ellipse cx="50" cy="72" rx="38" ry="15" style="fill:{{ p2 }}"></ellipse><ellipse cx="50" cy="70" rx="27" ry="9" style="fill:{{ p1 }}"></ellipse><g style="transform-box:fill-box;transform-origin:center;animation:pk-float calc(4.4s * var(--spd, 1)) ease-in-out infinite"><ellipse cx="40" cy="65" rx="9" ry="6" style="fill:{{ p3 }}"></ellipse><ellipse cx="56" cy="63" rx="8" ry="6" style="fill:{{ p2 }}"></ellipse><ellipse cx="62" cy="69" rx="6" ry="4" style="fill:{{ p3 }}"></ellipse></g></sc-if>
  <sc-if value="{{ kBurger }}"><rect x="24" y="78" width="52" height="12" rx="6" style="fill:{{ p2 }}"></rect><rect x="21" y="68" width="58" height="10" rx="5" style="fill:{{ p3 }}"></rect><rect x="19" y="64" width="62" height="6" rx="3" style="fill:{{ p1 }}"></rect><g style="transform-box:fill-box;transform-origin:bottom center;animation:pk-float calc(3.8s * var(--spd, 1)) ease-in-out infinite"><path d="M22 64a28 22 0 0 1 56 0z" style="fill:{{ p2 }}"></path><ellipse cx="40" cy="52" rx="2.5" ry="1.6" style="fill:{{ p1 }}"></ellipse><ellipse cx="52" cy="48" rx="2.5" ry="1.6" style="fill:{{ p1 }}"></ellipse><ellipse cx="62" cy="54" rx="2.5" ry="1.6" style="fill:{{ p1 }}"></ellipse></g></sc-if>
  <sc-if value="{{ kTaco }}"><g style="transform-box:fill-box;transform-origin:bottom center;animation:pk-float calc(4s * var(--spd, 1)) ease-in-out infinite"><circle cx="30" cy="64" r="7" style="fill:{{ p1 }}"></circle><circle cx="43" cy="56" r="7.5" style="fill:{{ p3 }}"></circle><circle cx="57" cy="56" r="7" style="fill:{{ p1 }}"></circle><circle cx="70" cy="64" r="7" style="fill:{{ p3 }}"></circle></g><path d="M16 90a34 34 0 0 1 68 0z" style="fill:{{ p2 }}"></path></sc-if>
  <sc-if value="{{ kPizza }}"><g style="transform-box:fill-box;transform-origin:50% 100%;animation:pk-sway calc(5s * var(--spd, 1)) ease-in-out infinite"><path d="M50 94 L22 46 Q50 32 78 46 Z" style="fill:{{ p2 }}"></path><path d="M22 46 Q50 32 78 46 L75 52 Q50 39 25 52Z" style="fill:{{ p3 }}"></path><circle cx="45" cy="58" r="5" style="fill:{{ p3 }}"></circle><circle cx="57" cy="66" r="4" style="fill:{{ p1 }}"></circle><circle cx="48" cy="76" r="3.5" style="fill:{{ p3 }}"></circle></g></sc-if>
  <sc-if value="{{ kToast }}"><path d="M26 92V58a13 13 0 0 1 6-24h36a13 13 0 0 1 6 24v34z" style="fill:{{ p2 }}"></path><path d="M33 87V60a8 8 0 0 1 3-18h28a8 8 0 0 1 3 18v27z" style="fill:{{ p1 }}"></path><ellipse cx="50" cy="66" rx="12" ry="9" style="fill:{{ p3 }};transform-box:fill-box;transform-origin:center;animation:pk-sizzle calc(3s * var(--spd, 1)) ease-in-out infinite"></ellipse></sc-if>
  <sc-if value="{{ kWrap }}"><rect x="30" y="40" width="40" height="60" rx="20" transform="rotate(-18 50 70)" style="fill:{{ p2 }}"></rect><g style="transform-box:fill-box;transform-origin:center;animation:pk-float calc(4s * var(--spd, 1)) ease-in-out infinite"><ellipse cx="41" cy="44" rx="19" ry="8" transform="rotate(-18 41 44)" style="fill:{{ p3 }}"></ellipse><circle cx="35" cy="43" r="4" style="fill:{{ p1 }}"></circle><circle cx="46" cy="40" r="3.5" style="fill:{{ p1 }}"></circle></g></sc-if>
  <sc-if value="{{ kDumpling }}"><ellipse cx="50" cy="86" rx="38" ry="9" style="fill:{{ p2 }}"></ellipse><path d="M16 84a17 15 0 0 1 34 0z" style="fill:{{ p1 }}"></path><path d="M50 84a17 15 0 0 1 34 0z" style="fill:{{ p1 }}"></path><g style="transform-box:fill-box;transform-origin:bottom center;animation:pk-float calc(3.6s * var(--spd, 1)) ease-in-out infinite"><path d="M32 72a18 16 0 0 1 36 0z" style="fill:{{ p3 }}"></path></g><path d="M26 74v6M33 72v8M60 74v6M67 72v8" style="stroke:{{ p2 }};stroke-width:2.5;stroke-linecap:round"></path></sc-if>
  <sc-if value="{{ kSkewer }}"><line x1="18" y1="98" x2="82" y2="28" style="stroke:{{ p3 }};stroke-width:4;stroke-linecap:round"></line><g style="transform-box:fill-box;transform-origin:center;animation:pk-sizzle calc(2.4s * var(--spd, 1)) ease-in-out infinite"><rect x="23" y="75" width="18" height="15" rx="6" transform="rotate(-48 32 82)" style="fill:{{ p2 }}"></rect><rect x="35" y="62" width="18" height="15" rx="7" transform="rotate(-48 44 69)" style="fill:{{ p1 }}"></rect><rect x="47" y="49" width="18" height="15" rx="6" transform="rotate(-48 56 56)" style="fill:{{ p2 }}"></rect><rect x="59" y="36" width="18" height="15" rx="7" transform="rotate(-48 68 43)" style="fill:{{ p1 }}"></rect></g></sc-if>
  <sc-if value="{{ kSmoothie }}"><line x1="56" y1="46" x2="66" y2="18" style="stroke:{{ p3 }};stroke-width:5;stroke-linecap:round"></line><path d="M30 44h40l-5 49a6 6 0 0 1-6 5H41a6 6 0 0 1-6-5z" style="fill:{{ p2 }}"></path><ellipse cx="50" cy="44" rx="20" ry="4" style="fill:{{ p3 }}"></ellipse><circle cx="71" cy="46" r="8" style="fill:{{ p1 }};transform-box:fill-box;transform-origin:center;animation:pk-float calc(3.4s * var(--spd, 1)) ease-in-out infinite"></circle></sc-if>
  <sc-if value="{{ kCake }}"><rect x="24" y="58" width="52" height="36" rx="7" style="fill:{{ p2 }}"></rect><rect x="24" y="52" width="52" height="13" rx="6.5" style="fill:{{ p3 }}"></rect><circle cx="50" cy="45" r="6" style="fill:{{ p3 }};transform-box:fill-box;transform-origin:center;animation:pk-float calc(3.6s * var(--spd, 1)) ease-in-out infinite"></circle></sc-if>
  <sc-if value="{{ kBread }}"><path d="M18 90V72a32 26 0 0 1 64 0v18a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4z" style="fill:{{ p2 }}"></path><g style="transform-box:fill-box;transform-origin:center;animation:pk-sizzle calc(3.2s * var(--spd, 1)) ease-in-out infinite"><path d="M34 60l7 9M47 56l7 9M60 58l7 9" style="stroke:{{ p1 }};stroke-width:4;stroke-linecap:round"></path></g></sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:250},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bowl&quot;,&quot;noodles&quot;,&quot;salad&quot;,&quot;pot&quot;,&quot;pan&quot;,&quot;plate&quot;,&quot;burger&quot;,&quot;taco&quot;,&quot;pizza&quot;,&quot;toast&quot;,&quot;wrap&quot;,&quot;dumpling&quot;,&quot;skewer&quot;,&quot;smoothie&quot;,&quot;cake&quot;,&quot;bread&quot;],&quot;default&quot;:&quot;bowl&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hue&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#F7B94A&quot;,&quot;#DE8CF2&quot;,&quot;#A5C7AE&quot;,&quot;#F08A5D&quot;,&quot;#A8BEE3&quot;],&quot;default&quot;:&quot;#F7B94A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const KINDS = ['bowl','noodles','salad','pot','pan','plate','burger','taco','pizza','toast','wrap','dumpling','skewer','smoothie','cake','bread'];
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'bowl', h = this.props.hue ?? '#F7B94A', bg = this.props.bg ?? true;
    const out = {
      p0: bg ? `color-mix(in oklch, ${h} 18%, var(--surface2, #EFEDE8))` : 'transparent',
      p1: `color-mix(in oklch, ${h} 34%, var(--surface2, #EFEDE8))`,
      p2: `color-mix(in oklch, ${h} 58%, var(--surface2, #EFEDE8))`,
      p3: `color-mix(in oklch, ${h} 82%, var(--ink, #1F1E1C) 18%)`
    };
    KINDS.forEach(n => { out['k' + n[0].toUpperCase() + n.slice(1)] = n === k; });
    return out;
  }
}
</script>
</body>
</html>
