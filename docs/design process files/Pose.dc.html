<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./r12-art.js"></script></helmet>
<div style="position:relative;width:100%;height:100%;--r11ps:{{ ps }};transform:{{ tf }}">{{ art }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:210,&quot;height&quot;:225},&quot;pose&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;waving&quot;,&quot;pointing&quot;,&quot;wink&quot;],&quot;default&quot;:&quot;waving&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;small&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;still&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;play&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;layer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.R12) this.t = setInterval(() => { if (window.R12) { clearInterval(this.t); this.forceUpdate(); } }, 50); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const R = window.R12, pose = this.props.pose ?? 'waving', dark = (this.props.theme ?? 'light') === 'dark';
    let html = '';
    if (R) html = this.props.layer ? R.layerSvg(pose, this.props.layer) : R.svg(pose, { mode: this.props.still ? 'still' : 'live', small: !!this.props.small, sc: dark ? '#F3EFE8' : R.INK });
    return {
      ps: (this.props.play ?? true) ? 'running' : 'paused',
      tf: this.props.flip ? 'scaleX(-1)' : 'none',
      art: React.createElement('div', { style: { position: 'absolute', inset: 0 }, dangerouslySetInnerHTML: { __html: html } })
    };
  }
}
</script>
</body>
</html>
