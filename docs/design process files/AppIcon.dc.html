<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ s }};height:{{ s }};border-radius:{{ r }};overflow:hidden;background:{{ bg }};box-shadow:{{ sh }}">
  <div style="position:absolute;left:0;top:0;width:108px;height:108px;transform:scale({{ k }});transform-origin:0 0">
    <sc-if value="{{ steam }}">
      <div style="position:absolute;left:44px;top:22px;width:5px;height:14px;border-radius:3px;background:{{ fg }};opacity:.55"></div>
      <div style="position:absolute;left:59px;top:19px;width:5px;height:17px;border-radius:3px;background:{{ fg }};opacity:.55"></div>
    </sc-if>
    <div style="position:absolute;left:24px;top:44px;width:60px;height:9px;border-radius:5px;background:{{ fg }}"></div>
    <div style="position:absolute;left:18px;top:52px;width:12px;height:7px;border-radius:4px;background:{{ fg }}"></div>
    <div style="position:absolute;right:18px;top:52px;width:12px;height:7px;border-radius:4px;background:{{ fg }}"></div>
    <div style="position:absolute;left:28px;top:51px;width:52px;height:36px;border-radius:0 0 22px 22px / 0 0 20px 20px;background:{{ fg }}">
      <i style="position:absolute;left:14px;top:12px;width:6px;height:7px;border-radius:50%;background:{{ face }}"></i>
      <i style="position:absolute;right:14px;top:12px;width:6px;height:7px;border-radius:50%;background:{{ face }}"></i>
      <i style="position:absolute;left:21px;top:21px;width:10px;height:5px;border:2.5px solid {{ face }};border-top:none;border-radius:0 0 7px 7px;box-sizing:border-box"></i>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:140},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:108,&quot;tsType&quot;:&quot;number&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;squircle&quot;,&quot;circle&quot;,&quot;square&quot;],&quot;default&quot;:&quot;squircle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mono&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;flat&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.size ?? 108, shape = this.props.shape ?? 'squircle', mono = !!this.props.mono;
    return {
      s: s + 'px', k: s / 108,
      r: shape === 'circle' ? '50%' : shape === 'square' ? (s * 0.18) + 'px' : '48% 52% 46% 54% / 55% 50% 50% 45%',
      bg: mono ? (this.props.monoBg ?? '#DCE3D9') : 'linear-gradient(145deg,#FCD980,#F29B32)',
      fg: mono ? (this.props.monoFg ?? '#2E3A2F') : '#FFFBF2', face: mono ? (this.props.monoBg ?? '#DCE3D9') : '#E0891E',
      sh: this.props.flat ? 'none' : '0 14px 28px -12px rgba(120,70,0,.45)', steam: true
    };
  }
}
</script>
</body>
</html>
